<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Afterburner</title>
    <meta
      name="description"
      content="Browser games opened through Scramjet."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="lobby">
      <header class="top">
        <a class="mark" href="/">Afterburner</a>
        <p class="via">Games open through Scramjet</p>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">Unblocked lobby</p>
          <h1>Play the cabinet.<br />Skip the block page.</h1>
        </div>
        <p class="lede">
          Pick a game and it loads inside this site. Scramjet fetches the
          page, so the address you see stays here.
        </p>
      </section>

      <div class="toolbar">
        <div class="filters" id="filters" role="tablist" aria-label="Categories"></div>
        <form id="finder" class="finder">
          <label class="sr" for="query">Search games or paste a link</label>
          <input
            id="query"
            name="query"
            type="search"
            placeholder="Search titles, or paste any game link"
            autocomplete="off"
          />
          <button type="submit">Open</button>
        </form>
      </div>

      <p id="empty" class="empty" hidden>No games match that search.</p>
      <section id="grid" class="grid" aria-live="polite"></section>
    </div>

    <section id="player" class="player" hidden>
      <header class="player-bar">
        <button id="back" type="button">Lobby</button>
        <div class="player-meta">
          <strong id="player-title">Game</strong>
          <span id="player-host"></span>
        </div>
        <button id="reload" type="button">Reload</button>
      </header>
      <div id="frame-host" class="frame-host"></div>
      <p id="player-status" class="player-status">Opening through Scramjet…</p>
    </section>

    <p id="toast" class="toast" role="alert" hidden></p>

    <script src="/baremux/index.js" defer></script>
    <script src="/scram/scramjet.all.js" defer></script>
    <script src="/register-sw.js" defer></script>
    <script src="/app.js" type="module" defer></script>
  </body>
</html>
